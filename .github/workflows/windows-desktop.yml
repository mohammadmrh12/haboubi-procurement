name: Windows Desktop EXE
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'desktop-32/**'
      - 'server.js'
      - 'auth.js'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'forms-addon.js'
      - 'catalog-seed.js'
      - 'drug-aliases.js'
      - 'vendor/**'
      - 'tests/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Run source tests
        run: node --test tests/drug-search.test.js tests/frontend-contract.test.js tests/import-parser.test.js tests/auth-smoke.js tests/windows-desktop.test.js
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Haboubi-Procurement-Windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-windows-ia32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-32/package-lock.json
      - name: Install 32-bit desktop dependencies
        working-directory: desktop-32
        run: npm ci
      - name: Run source tests
        run: node --test tests/drug-search.test.js tests/frontend-contract.test.js tests/import-parser.test.js tests/auth-smoke.js tests/windows-desktop.test.js
      - name: Build Windows 32-bit installer
        working-directory: desktop-32
        run: npm run dist:win:ia32
      - uses: actions/upload-artifact@v4
        with:
          name: Haboubi-Procurement-Windows-ia32
          path: desktop-32/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish public 32-bit installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-32bit-v1.0.7
          name: Haboubi Procurement Windows 32-bit 1.0.7
          body: Windows 32-bit (x86) installer for Haboubi Procurement. Built by GitHub Actions from the main branch.
          prerelease: true
          files: desktop-32/dist/Haboubi-Procurement-Setup-1.0.7-32bit.exe
          fail_on_unmatched_files: true
